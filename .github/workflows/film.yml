name: Tonight's cut

on:
  schedule:
    - cron: "30 18 * * *" # midnight in Bengaluru
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.mjs, data/story.json]

permissions:
  contents: write

concurrency: film

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit the new cut
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Tonight's cut: $(date -u +%F)"
          git push
